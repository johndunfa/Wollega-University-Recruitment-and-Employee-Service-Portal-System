version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      - resume-scoring-service

  resume-scoring-service:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./python_service:/app